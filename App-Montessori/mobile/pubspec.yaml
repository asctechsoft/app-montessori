name: app_montessori
description: "Mam non da co so - 1 app, 3 vai tro (phu huynh / giao vien / hieu truong)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.7.3

  # ASC shared base. Dung path dependency vi may dev co san `D:\App_Start_Up\asc_common`
  # (app_montessori/mobile -> ../../asc_common).
  # De chuyen sang git ref ghim theo commit nhu muvik: xoa dong `path:` va dung
  #   asc_common:
  #     git:
  #       url: https://github.com/asctechsoft/asc_common.git
  #       ref: 96a4c3b
  asc_common:
    path: ../../asc_common

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  cloud_functions: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0
  firebase_crashlytics: ^5.0.1

  shared_preferences: ^2.5.5
  intl: ^0.20.2
  flutter_svg: ^2.3.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  geolocator: ^14.0.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.2
  uuid: ^4.5.1
  xml: '>=6.0.0 <8.0.0'
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/xml_strings/values/
    - lib/xml_strings/values-vi/
